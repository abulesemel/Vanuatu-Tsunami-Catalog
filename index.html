    <body>

        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-23.726079712170684,-179.69389753682572],[-9.519825858537592,179.6488901598748]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // add class to format popup if it contains media
		function addClassToPopupIfMedia(content, popup) {
			var tempDiv = document.createElement('div');
			tempDiv.innerHTML = content;
			if (tempDiv.querySelector('td img')) {
				popup._contentNode.classList.add('media');
					// Delay to force the redraw
					setTimeout(function() {
						popup.update();
					}, 10);
			} else {
				popup._contentNode.classList.remove('media');
			}
		}
        var title = new L.Control({'position':'topleft'});
        title.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };
        title.update = function () {
            this._div.innerHTML = '<h2>Vanuatu Tsunami Catalog</h2>';
        };
        title.addTo(map);
        var abstract = new L.Control({'position':'bottomleft'});
        abstract.onAdd = function (map) {
            this._div = L.DomUtil.create('div',
            'leaflet-control abstract');
            this._div.id = 'abstract'
                this._div.setAttribute("onmouseenter", "abstract.show()");
                this._div.setAttribute("onmouseleave", "abstract.hide()");
                this.hide();
                return this._div;
            };
            abstract.hide = function () {
                this._div.classList.remove("abstractUncollapsed");
                this._div.classList.add("abstract");
                this._div.innerHTML = 'i'
            }
            abstract.show = function () {
                this._div.classList.remove("abstract");
                this._div.classList.add("abstractUncollapsed");
                this._div.innerHTML = 'This webmap presents the locations of earthquakes that have generated tsunamis affecting Vanuatu, based on data from the Vanuatu Tsunami Catalog – Local Tsunami (Version: August 2023) developed under the JICA VAN-REDI Project. The map visualizes historical tsunami-generating earthquake events and spatially organizes them within eight regions across the Vanuatu archipelago. ';
        };
        abstract.addTo(map);
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_GEBCOGridshadedrelief_0');
        map.getPane('pane_GEBCOGridshadedrelief_0').style.zIndex = 400;
        var layer_GEBCOGridshadedrelief_0 = L.WMS.layer("https://wms.gebco.net/mapserv", "GEBCO_LATEST", {
            pane: 'pane_GEBCOGridshadedrelief_0',
            format: 'image/png',
            uppercase: true,
            transparent: true,
            continuousWorld : true,
            tiled: true,
            info_format: 'text/html',
            opacity: 1,
            identify: false,
            attribution: '',
        });
        map.addLayer(layer_GEBCOGridshadedrelief_0);
        function pop_BackArc_1(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['id'] !== null ? autolinker.link(String(feature.properties['id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['Name'] !== null ? autolinker.link(String(feature.properties['Name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_BackArc_1_0() {
            return {
                pane: 'pane_BackArc_1',
                opacity: 1,
                color: 'rgba(240,252,13,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 3.0,
                fillOpacity: 0,
                interactive: false,
            }
        }
        map.createPane('pane_BackArc_1');
        map.getPane('pane_BackArc_1').style.zIndex = 401;
        map.getPane('pane_BackArc_1').style['mix-blend-mode'] = 'normal';
        var layer_BackArc_1 = new L.geoJson(json_BackArc_1, {
            attribution: '',
            interactive: false,
            dataVar: 'json_BackArc_1',
            layerName: 'layer_BackArc_1',
            pane: 'pane_BackArc_1',
            onEachFeature: pop_BackArc_1,
            style: style_BackArc_1_0,
        });
        bounds_group.addLayer(layer_BackArc_1);
        map.addLayer(layer_BackArc_1);
        function pop_Regions_2(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['id'] !== null ? autolinker.link(String(feature.properties['id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Region</th>\
                        <td>' + (feature.properties['Region'] !== null ? autolinker.link(String(feature.properties['Region']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Description</th>\
                        <td class="visible-with-data" id="Descriptio">' + (feature.properties['Descriptio'] !== null ? autolinker.link(String(feature.properties['Descriptio']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Regions_2_0() {

                fillOpacity: 0,

        }
        map.createPane('pane_Regions_2');
        map.getPane('pane_Regions_2').style.zIndex = 402;
        map.getPane('pane_Regions_2').style['mix-blend-mode'] = 'normal';
        var layer_Regions_2 = new L.geoJson(json_Regions_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Regions_2',
            layerName: 'layer_Regions_2',
            pane: 'pane_Regions_2',
            onEachFeature: pop_Regions_2,
            style: style_Regions_2_0,
        });
        bounds_group.addLayer(layer_Regions_2);
        map.addLayer(layer_Regions_2);
        function pop_Islands_3(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Island </th>\
                        <td class="visible-with-data" id="Is_Name">' + (feature.properties['Is_Name'] !== null ? autolinker.link(String(feature.properties['Is_Name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Islands_3_0() {
            return {
                pane: 'pane_Islands_3',
                opacity: 1,
                color: 'rgba(0,0,0,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',

                fillOpacity: 0,

        }
        map.createPane('pane_Islands_3');
        map.getPane('pane_Islands_3').style.zIndex = 403;
        map.getPane('pane_Islands_3').style['mix-blend-mode'] = 'normal';
        var layer_Islands_3 = new L.geoJson(json_Islands_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Islands_3',
            layerName: 'layer_Islands_3',
            pane: 'pane_Islands_3',
            onEachFeature: pop_Islands_3,
            style: style_Islands_3_0,
        });
        bounds_group.addLayer(layer_Islands_3);
        map.addLayer(layer_Islands_3);
        function pop_World_4(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['fid'] !== null ? autolinker.link(String(feature.properties['fid']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['iso_a2'] !== null ? autolinker.link(String(feature.properties['iso_a2']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['NAME'] !== null ? autolinker.link(String(feature.properties['NAME']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['FIPS_10_'] !== null ? autolinker.link(String(feature.properties['FIPS_10_']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['ISO_A3'] !== null ? autolinker.link(String(feature.properties['ISO_A3']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['WB_A2'] !== null ? autolinker.link(String(feature.properties['WB_A2']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['WB_A3'] !== null ? autolinker.link(String(feature.properties['WB_A3']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_World_4_0() {
            return {
                pane: 'pane_World_4',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 1.0,
                fillOpacity: 0,
                interactive: false,
            }
        }
        map.createPane('pane_World_4');
        map.getPane('pane_World_4').style.zIndex = 404;
        map.getPane('pane_World_4').style['mix-blend-mode'] = 'normal';
        var layer_World_4 = new L.geoJson(json_World_4, {
            attribution: '',
            interactive: false,
            dataVar: 'json_World_4',

        bounds_group.addLayer(layer_World_4);
        map.addLayer(layer_World_4);
        function pop_TsunamiSourceLocation_5(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Magnitude</th>\
                        <td>' + (feature.properties['Magnitude'] !== null ? autolinker.link(String(feature.properties['Magnitude']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Origin Time</th>\
                        <td>' + (feature.properties['Origin Tim'] !== null ? autolinker.link(String(feature.properties['Origin Tim']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Latitude</th>\
                        <td>' + (feature.properties['Latitude'] !== null ? autolinker.link(String(feature.properties['Latitude']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Longitude</th>\
                        <td>' + (feature.properties['Longitude'] !== null ? autolinker.link(String(feature.properties['Longitude']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Depth (km)</th>\
                        <td>' + (feature.properties['Depth (KM)'] !== null ? autolinker.link(String(feature.properties['Depth (KM)']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Situation</th>\
                        <td>' + (feature.properties['Situation'] !== null ? autolinker.link(String(feature.properties['Situation']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Source</th>\
                        <td class="visible-with-data" id="Source">' + (feature.properties['Source'] !== null ? autolinker.link(String(feature.properties['Source']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_TsunamiSourceLocation_5_0(feature) {
            if (feature.properties['Magnitude'] >= 6.200000 && feature.properties['Magnitude'] <= 6.675000 ) {
                return {
                pane: 'pane_TsunamiSourceLocation_5',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,255,255,1.0)',
                interactive: true,
            }
            }
            if (feature.properties['Magnitude'] >= 6.675000 && feature.properties['Magnitude'] <= 7.150000 ) {
                return {
                pane: 'pane_TsunamiSourceLocation_5',
                radius: 5.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,170,170,1.0)',
                interactive: true,
            }
            }
            if (feature.properties['Magnitude'] >= 7.150000 && feature.properties['Magnitude'] <= 7.625000 ) {
                return {
                pane: 'pane_TsunamiSourceLocation_5',
                radius: 6.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,85,85,1.0)',
                interactive: true,
            }
            }
            if (feature.properties['Magnitude'] >= 7.625000 && feature.properties['Magnitude'] <= 8.100000 ) {
                return {
                pane: 'pane_TsunamiSourceLocation_5',
                radius: 7.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,0,0,1.0)',
                interactive: true,
            }
            }
        }
        map.createPane('pane_TsunamiSourceLocation_5');
        map.getPane('pane_TsunamiSourceLocation_5').style.zIndex = 405;
        map.getPane('pane_TsunamiSourceLocation_5').style['mix-blend-mode'] = 'normal';
        var layer_TsunamiSourceLocation_5 = new L.geoJson(json_TsunamiSourceLocation_5, {
            attribution: '',
            interactive: true,
            dataVar: 'json_TsunamiSourceLocation_5',
            layerName: 'layer_TsunamiSourceLocation_5',
            pane: 'pane_TsunamiSourceLocation_5',
            onEachFeature: pop_TsunamiSourceLocation_5,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_TsunamiSourceLocation_5_0(feature));
            },
        });
        bounds_group.addLayer(layer_TsunamiSourceLocation_5);
        map.addLayer(layer_TsunamiSourceLocation_5);
        var overlaysTree = [
    {label: 'Tsunami Source Location', layer: layer_TsunamiSourceLocation_5},
    {label: 'Regions', layer: layer_Regions_2},
    {label: 'Back Arc', layer: layer_BackArc_1}
];
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
// Permanent Legend
var legend = L.control({position: 'bottomright'});

    var div = L.DomUtil.create('div', 'legend');

    div.innerHTML = `

        <b>Tsunami Source Location</b>
        <table style="margin-top:5px;">
            <tr>

        <svg width="12" height="12">

                fill="#ffffff"

<tr>

legend.addTo(map);
        setBounds();
        resetLabels([layer_BackArc_1,layer_Regions_2,layer_Islands_3]);
        map.on("zoomend", function(){
            resetLabels([layer_BackArc_1,layer_Regions_2,layer_Islands_3]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_BackArc_1,layer_Regions_2,layer_Islands_3]);
        });
        map.on("layerremove", function(){

        </script>
